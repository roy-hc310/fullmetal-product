version: "2"
sql:
  - engine: "postgresql"
    schema: 
      - "migrations/000001_products.up.sql"
    queries: "modules/module_product/entity/queries.sql"
    gen:
      go:
        package: "entity"
        out: "modules/module_product/entity"
        sql_package: "pgx/v5"
        overrides: 
          - db_type: "uuid"
            nullable: true
            go_type: 
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "uuid"
            nullable: false
            go_type: 
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: false
